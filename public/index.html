<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Viora</title>
<style>
  :root { --bg:#14122b; --ink:#f3f1ff; --muted:#a9a4d6; --accent:#7c6cff; --card:#1e1b3d; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f4ff; --ink:#1b1840; --muted:#5d5a8a; --card:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, sans-serif; padding:1rem; }
  main { width:100%; max-width:24rem; background:var(--card); border-radius:18px; padding:2.25rem 2rem; text-align:center; }
  h1 { margin:0 0 .5rem; font-size:2rem; letter-spacing:-.02em; }
  p { margin:0 0 1.5rem; color:var(--muted); }
  a.btn, button { display:inline-flex; align-items:center; justify-content:center; gap:.6rem; width:100%; padding:.8rem 1rem; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  a.btn:focus-visible, button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  img { width:64px; height:64px; border-radius:50%; margin-bottom:.75rem; }
</style>
</head>
<body>
<main id="app">
  <h1>Viora</h1>
  <p>Sign in with Google to continue.</p>
  <a class="btn" href="/auth/google">Continue with Google</a>
</main>
<script>
fetch('/api/me').then(r => r.json()).then(u => {
  if (!u) return;
  const app = document.getElementById('app');
  app.textContent = '';
  if (u.picture) { const i = document.createElement('img'); i.src = u.picture; i.alt = ''; i.referrerPolicy = 'no-referrer'; app.append(i); }
  const h = document.createElement('h1'); h.textContent = u.name || 'Signed in';
  const p = document.createElement('p'); p.textContent = u.email;
  const f = document.createElement('form'); f.method = 'post'; f.action = '/logout';
  const b = document.createElement('button'); b.textContent = 'Sign out';
  f.append(b); app.append(h, p, f);
}).catch(() => {});
</script>
</body>
</html>
